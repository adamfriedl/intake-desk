services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intake_desk
    ports:
      - '5432:5432'
    volumes:
      - intake_desk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intake -d intake_desk']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://intake:intake@db:5432/intake_desk
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./corpus:/app/corpus:ro
      - ./eval:/app/eval:ro

volumes:
  intake_desk_pgdata:
